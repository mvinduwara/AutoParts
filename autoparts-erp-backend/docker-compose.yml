version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autoparts_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: